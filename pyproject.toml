[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-router-ui"
version = "0.1.0"
description = "Private administration panel for domain-router"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "markdown-it-py>=3,<5",
  "PyYAML>=6,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[project.scripts]
domain-router = "domain_router.cli:main"
domain-router-ui-admin = "domain_router_ui.admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
domain_router_ui = ["templates/*.html", "help/*.md", "static/*.css", "static/*.js", "static/*.svg", "static/*LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
