<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Domain Router{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body>
  {% if session %}
  <header class="topbar">
    <a class="brand" href="/" aria-label="Domain Router">
      <span class="brand-mark">DR</span>
      <span>Domain Router</span>
    </a>
    <nav class="nav" aria-label="Основная навигация">
      <a href="/" {% if request.url.path == '/' or request.url.path.startswith('/routes') %}aria-current="page"{% endif %}><img src="/static/route.svg" alt="" width="16" height="16">Маршруты</a>
      <a href="/internal" {% if request.url.path.startswith('/internal') %}aria-current="page"{% endif %}><img src="/static/network.svg" alt="" width="16" height="16">Внутренние адреса</a>
      <a href="/access" {% if request.url.path.startswith('/access') %}aria-current="page"{% endif %}><img src="/static/key-round.svg" alt="" width="16" height="16">Доступы</a>
      <a href="/integrations" {% if request.url.path == '/integrations' %}aria-current="page"{% endif %}><img src="/static/plug.svg" alt="" width="16" height="16">Подключения</a>
      <a href="/docs" {% if request.url.path.startswith('/docs') %}aria-current="page"{% endif %}><img src="/static/scroll-text.svg" alt="" width="16" height="16">Документация</a>
      <a href="/audit" {% if request.url.path == '/audit' %}aria-current="page"{% endif %}><img src="/static/scroll-text.svg" alt="" width="16" height="16">Журнал</a>
      <a href="/account" {% if request.url.path == '/account' %}aria-current="page"{% endif %}><img src="/static/settings.svg" alt="" width="16" height="16">Профиль</a>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf_token" value="{{ logout_csrf|default('') }}">
        <button class="nav-button icon-button" type="submit" title="Выйти" aria-label="Выйти"><img src="/static/log-out.svg" alt="" width="16" height="16"></button>
      </form>
    </nav>
  </header>
  {% endif %}
  <main class="page{% if not session %} page-auth{% endif %}">
    {% if notice %}<div class="alert alert-success" role="status">{{ notice }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
